<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b2f52">

  <title>Check-in | Happy Hour dos Professores</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --navy: #0b2f52;
      --blue: #164e7a;
      --gold: #d5a23f;
      --white: #ffffff;
      --muted: #d8e3ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--white);

      background:
        radial-gradient(
          circle at 85% 10%,
          #1c5f91 0,
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #071f38,
          #0c365d 55%,
          #071f38
        );
    }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 20px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 8px 0;
      color: #f4cc72;
      font-size: clamp(24px, 6vw, 38px);
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      padding: 13px;
      text-align: center;
      background: #ffffff12;
      border: 1px solid #ffffff28;
      border-radius: 14px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      padding: 16px;
      color: #16324a;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 18px 45px #00000066;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    button,
    input {
      padding: 12px;
      font: inherit;
      border: 1px solid #cbd5df;
      border-radius: 10px;
    }

    button {
      color: #ffffff;
      font-weight: 700;
      background: var(--navy);
      border: none;
      cursor: pointer;
    }

    button.secondary {
      color: #16324a;
      background: #e9eef3;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #reader {
      display: none;
      width: 100%;
      min-height: 280px;
      margin-bottom: 12px;
      overflow: hidden;
      background: #0a0a0a;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    .manual {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .manual input {
      flex: 1;
      min-width: 0;
    }

    .result {
      display: none;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
    }

    .result.show {
      display: block;
    }

    .result.ok {
      color: #166534;
      background: #dcfce7;
    }

    .result.warn {
      color: #8a5a00;
      background: #fff4d6;
    }

    .result.error {
      color: #991b1b;
      background: #fee2e2;
    }

    .result strong {
      display: block;
      margin-bottom: 4px;
      font-size: 20px;
    }

    .config {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .config button {
      padding: 7px 10px;
      font-size: 12px;
      background: #ffffff18;
    }

    .pulse {
      animation: pulse 0.45s ease;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.015);
      }
    }

    @media (max-width: 520px) {
      .stat {
        padding: 10px 6px;
      }

      .stat strong {
        font-size: 23px;
      }

      .manual {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>HAPPY HOUR</h1>
      <p>Check-in dos Professores</p>
    </header>

    <section
      class="stats"
      aria-label="Resumo do evento"
    >
      <div class="stat">
        <strong id="total">—</strong>
        <span>TOTAL</span>
      </div>

      <div class="stat">
        <strong id="entries">—</strong>
        <span>ENTRADAS</span>
      </div>

      <div class="stat">
        <strong id="pending">—</strong>
        <span>PENDENTES</span>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <button id="start" type="button">
          Abrir câmera
        </button>

        <button
          id="stop"
          type="button"
          class="secondary"
          disabled
        >
          Parar câmera
        </button>
      </div>

      <div id="reader"></div>

      <form
        id="manual"
        class="manual"
      >
        <input
          id="token"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="Cole ou digite o código do convite"
        >

        <button type="submit">
          Confirmar
        </button>
      </form>

      <div
        id="result"
        class="result"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <div class="config">
      <button
        id="configure"
        type="button"
      >
        Configurar endereço da API
      </button>
    </div>
  </main>

  <script>
    const DEFAULT_API_URL =
      'https://script.google.com/macros/s/AKfycbzYBHnl8Su8UAxsmvGT6QzKyZRDquuw2hlPCht3xHMQL3DGwF-qPOtfqcP-m59c_w-8/exec';

    let apiUrl =
      localStorage.getItem('happyHourApiUrl') ||
      DEFAULT_API_URL;

    let scanner = null;
    let busy = false;
    let lastToken = '';
    let lastAt = 0;
    let statsLoaded = false;

    const $ = function (id) {
      return document.getElementById(id);
    };

    function escapeHtml(value) {
      const element =
        document.createElement('div');

      element.textContent =
        String(value || '');

      return element.innerHTML;
    }

    function show(type, title, detail) {
      const box = $('result');

      box.className =
        'result show ' +
        type +
        ' pulse';

      box.innerHTML =
        '<strong>' +
        escapeHtml(title) +
        '</strong>' +
        escapeHtml(detail || '');

      setTimeout(function () {
        box.classList.remove('pulse');
      }, 500);
    }

    function setStats(stats) {
      if (!stats) return;

      $('total').textContent =
        typeof stats.total !== 'undefined'
          ? stats.total
          : '—';

      $('entries').textContent =
        typeof stats.entries !== 'undefined'
          ? stats.entries
          : '—';

      $('pending').textContent =
        typeof stats.pending !== 'undefined'
          ? stats.pending
          : '—';

      statsLoaded = true;
    }

    function configured() {
      return (
        apiUrl.indexOf(
          'https://script.google.com/macros/s/'
        ) === 0 &&
        apiUrl.slice(-5) === '/exec'
      );
    }

    function clean(value) {
      const text = String(value || '')
        .trim()
        .toUpperCase();

      const match = text.match(
        /HH26-[A-F0-9]{24}/
      );

      return match ? match[0] : '';
    }

    /*
     * Realiza a comunicação com o Apps Script por JSONP.
     * Isso evita o bloqueio de CORS entre GitHub Pages
     * e Google Apps Script.
     */
    function callApiJsonp(action, parameters) {
      return new Promise(function (
        resolve,
        reject
      ) {
        const callbackName =
          'happyHourApi_' +
          Date.now().toString(36) +
          Math.random()
            .toString(36)
            .slice(2, 7);

        const script =
          document.createElement('script');

        let finished = false;

        function cleanup() {
          if (finished) return;

          finished = true;

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] =
              undefined;
          }

          if (script.parentNode) {
            script.parentNode
              .removeChild(script);
          }
        }

        const timeout =
          setTimeout(function () {
            cleanup();

            reject(
              new Error(
                'A API não respondeu dentro do tempo esperado.'
              )
            );
          }, 20000);

        window[callbackName] =
          function (data) {
            clearTimeout(timeout);
            cleanup();
            resolve(data);
          };

        script.onerror = function () {
          clearTimeout(timeout);
          cleanup();

          reject(
            new Error(
              'Não foi possível acessar a API.'
            )
          );
        };

        let url =
          apiUrl +
          '?action=' +
          encodeURIComponent(action);

        Object.keys(parameters || {})
          .forEach(function (key) {
            url +=
              '&' +
              encodeURIComponent(key) +
              '=' +
              encodeURIComponent(
                parameters[key]
              );
          });

        url +=
          '&callback=' +
          encodeURIComponent(
            callbackName
          ) +
          '&cache=' +
          Date.now();

        script.src = url;

        document.body.appendChild(
          script
        );
      });
    }

    async function loadStats() {
      if (!configured()) {
        if (!statsLoaded) {
          show(
            'warn',
            'API não configurada',
            'Configure o endereço do Apps Script.'
          );
        }

        return;
      }

      try {
        const data =
          await callApiJsonp(
            'stats',
            {}
          );

        if (
          data &&
          typeof data.total !== 'undefined'
        ) {
          setStats(data);

        } else if (!statsLoaded) {
          show(
            'error',
            'Resposta inválida da API',
            'Os totais não foram encontrados.'
          );
        }

      } catch (error) {
        console.error(
          'Erro ao carregar totais:',
          error
        );

        if (!statsLoaded) {
          show(
            'error',
            'Não foi possível carregar os totais',
            error.message
          );
        }
      }
    }

    async function register(raw) {
      const token = clean(raw);

      if (!token) {
        show(
          'error',
          'QR Code inválido',
          'O código não pertence a este evento.'
        );

        return;
      }

      const now = Date.now();

      if (
        token === lastToken &&
        now - lastAt < 4000
      ) {
        return;
      }

      lastToken = token;
      lastAt = now;

      if (!configured()) {
        show(
          'warn',
          'Configure a API',
          'Informe o endereço /exec do Apps Script.'
        );

        return;
      }

      if (busy) return;

      busy = true;

      show(
        'warn',
        'Consultando convite...',
        'Aguarde a confirmação.'
      );

      try {
        const data =
          await callApiJsonp(
            'checkin',
            {
              token: token,
              operator: 'LEITOR WEB'
            }
          );

        if (data.stats) {
          setStats(data.stats);
        }

        if (data.ok) {
          show(
            'ok',
            data.message ||
              'Entrada confirmada!',
            (data.name || '') +
              ' • ' +
              (data.unit || '')
          );

          if (navigator.vibrate) {
            navigator.vibrate(150);
          }

        } else if (
          data.code === 'ALREADY_USED'
        ) {
          show(
            'warn',
            data.message ||
              'Entrada já registrada.',
            (data.name || '') +
              ' • ' +
              (data.checkedAt || '')
          );

          if (navigator.vibrate) {
            navigator.vibrate(
              [80, 80, 80]
            );
          }

        } else {
          show(
            'error',
            data.message ||
              'Não foi possível confirmar.',
            data.detail || ''
          );

          if (navigator.vibrate) {
            navigator.vibrate(350);
          }
        }

      } catch (error) {
        console.error(
          'Erro ao registrar entrada:',
          error
        );

        show(
          'error',
          'Falha de conexão',
          error.message ||
            'Não foi possível acessar a API.'
        );

      } finally {
        busy = false;
      }
    }

    async function startScanner() {
      try {
        if (
          typeof Html5Qrcode ===
          'undefined'
        ) {
          throw new Error(
            'A biblioteca do leitor não foi carregada.'
          );
        }

        $('reader').style.display =
          'block';

        if (!scanner) {
          scanner =
            new Html5Qrcode(
              'reader'
            );
        }

        await scanner.start(
          {
            facingMode: 'environment'
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false
          },

          function (decodedText) {
            console.log(
              'QR Code reconhecido:',
              decodedText
            );

            register(decodedText);
          },

          function () {
            /*
             * Leituras incompletas são ignoradas
             * enquanto a câmera continua aberta.
             */
          }
        );

        $('start').disabled = true;
        $('stop').disabled = false;

        show(
          'warn',
          'Câmera ativada',
          'Centralize o QR Code no quadrado.'
        );

      } catch (error) {
        console.error(
          'Erro ao iniciar câmera:',
          error
        );

        $('reader').style.display =
          'none';

        $('start').disabled = false;
        $('stop').disabled = true;

        show(
          'error',
          'Não foi possível iniciar o leitor',
          error.message ||
            'Verifique a permissão da câmera.'
        );
      }
    }

    async function stopScanner() {
      try {
        if (
          scanner &&
          scanner.isScanning
        ) {
          await scanner.stop();
        }

        $('reader').style.display =
          'none';

        $('start').disabled = false;
        $('stop').disabled = true;

      } catch (error) {
        console.error(
          'Erro ao parar câmera:',
          error
        );
      }
    }

    $('start').addEventListener(
      'click',
      startScanner
    );

    $('stop').addEventListener(
      'click',
      stopScanner
    );

    $('manual').addEventListener(
      'submit',
      function (event) {
        event.preventDefault();

        register(
          $('token').value
        );

        $('token').select();
      }
    );

    $('configure').addEventListener(
      'click',
      function () {
        const value = prompt(
          'Cole a URL /exec da implantação do Apps Script:',
          configured()
            ? apiUrl
            : DEFAULT_API_URL
        );

        if (!value) return;

        apiUrl = value.trim();

        localStorage.setItem(
          'happyHourApiUrl',
          apiUrl
        );

        statsLoaded = false;

        loadStats();

        show(
          'ok',
          'API configurada',
          'O endereço foi salvo neste navegador.'
        );
      }
    );

    loadStats();

    setInterval(
      loadStats,
      15000
    );
  </script>
</body>
</html>
